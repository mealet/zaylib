[package]
name = "zaylib"
description = "Zeen bindings for raylib"
authors = ["mealet <workjason34@gmail.com>"]
version = "0.0.0"
zeen = "^0.4.0"
type = "lib/static"

[build]
output = "zaylib"
link = ["raylib"]

[build.family.unix]
link = ["raylib", "m", "pthread", "dl"]

[build.os.linux]
link = ["raylib", "m", "pthread", "dl", "rt", "X11"]

[build.os.darwin]
link = ["raylib"]

[build.os.windows]
link = ["raylib", "winmm", "gdi32", "opengl32", "shell32", "ole32"]

[build.os.android]
link = ["raylib", "log", "android", "EGL", "GLESv2", "OpenSLES", "dl", "m"]

[dependencies]
